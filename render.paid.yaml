# Paid staging environment. Review the Render checkout before creating resources.
# Native Node deployment; Docker and a GPU are not required for the web service.
services:
  - type: web
    name: house-concept-studio-test
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist-server/index.cjs
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: studio-files
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        fromDatabase:
          name: house-concept-studio-test-db
          property: connectionString
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: house-concept-studio-test-db
    region: singapore
    plan: 0.1c-256mb
    diskSizeGB: 1
    databaseName: house_studio
    user: house_studio
    postgresMajorVersion: '17'
    ipAllowList: []
